name: Docker
# Main node images on GHCR: ghcr.io/1bossx/worker-plane-main and -caddy.
# Runs on a self-hosted Linux x86_64 runner with Docker, buildx and compose.
# amd64 builds natively; arm64 builds under QEMU on the same runner (native
# modules compile in the emulated image, so that build is slow). Both images
# pass deploy/docker/smoke.sh before a v* tag pushes the multi-arch tags.
# Pull requests only build and smoke-test.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'migrations/**'
      - 'pnpm-lock.yaml'
      - 'deploy/docker/**'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  REGISTRY: ghcr.io/1bossx
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ["self-hosted", "Linux", "X64"]
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check Docker
        run: |
          test "$(uname -m)" = x86_64
          docker info --format 'Docker {{.ServerVersion}} {{.OSType}}/{{.Architecture}}'
          docker buildx version
          docker compose version
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke-test
        run: |
          for arch in amd64 arm64; do
            for target in main caddy; do
              docker buildx build --load --platform "linux/$arch" \
                -f deploy/docker/Dockerfile --target "$target" \
                -t "local/worker-plane-$target:smoke-$arch" .
            done
          done
          SKIP_BUILD=1 SMOKE_TAG=smoke-amd64 deploy/docker/smoke.sh
          SKIP_BUILD=1 SMOKE_TAG=smoke-arm64 SMOKE_READY_SECS=300 deploy/docker/smoke.sh
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same builder as the smoke builds, so these reuse their layers.
      - name: Push multi-arch tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=${GITHUB_REF_NAME#v}
          for target in main caddy; do
            image="$REGISTRY/worker-plane-$target"
            docker buildx build --push --platform linux/amd64,linux/arm64 \
              -f deploy/docker/Dockerfile --target "$target" \
              --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
              --label org.opencontainers.image.revision=${{ github.sha }} \
              -t "$image:$version" .
            docker buildx imagetools inspect "$image:$version"
          done
      - name: Remove smoke images
        if: always()
        run: docker image rm -f local/worker-plane-{main,caddy}:smoke-{amd64,arm64} > /dev/null 2>&1 || true
