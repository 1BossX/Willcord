name: P1 foundations
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: verify (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: self-hosted
            runs-on: '["self-hosted", "macOS"]'
          - name: self-hosted-linux
            runs-on: '["self-hosted", "Linux"]'
    runs-on: ${{ fromJSON(matrix.runs-on) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt
      - run: pnpm protocol:generate
      - run: git diff --exit-code -- packages/protocol/src/generated.ts worker/src/generated.rs
      - run: cargo fmt --manifest-path worker/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path worker/Cargo.toml
      - run: cargo test --locked --manifest-path worker/Cargo.toml --features fault-injection
      - run: cargo build --locked --manifest-path worker/Cargo.toml
      # The P3-C fault tests use this binary; building it here keeps the
      # cold compile from competing with the timed end-to-end tests.
      - run: cargo build --locked --manifest-path worker/Cargo.toml --features fault-injection --target-dir worker/target/fault
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      # The main node as deployed: a release directory outside the checkout,
      # started the way the systemd unit starts it.
      - run: deploy/build-main.sh "$RUNNER_TEMP/worker-plane-main-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --skip-build
      - run: deploy/smoke-main.sh "$RUNNER_TEMP/worker-plane-main-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - run: cargo build --locked --release --manifest-path worker/Cargo.toml
      - run: git diff --check
