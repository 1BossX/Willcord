name: P1 foundations
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Both platforms run ci/verify.sh: every check, then the release acceptance
# from the built artifacts behind the production Caddyfile.
jobs:
  verify-macos:
    name: verify (self-hosted)
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      # Homebrew first, so setup-node's Node wins: OpenSSL 3 for test
      # certificates, and caddy for the release acceptance.
      - run: if [ -d /opt/homebrew/bin ]; then echo /opt/homebrew/bin >> "$GITHUB_PATH"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - run: corepack enable
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt
      - run: ci/verify.sh
  verify-linux:
    name: verify (self-hosted-linux)
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      # Ubuntu 24.04 (the main host's distribution) with pinned Node, pnpm,
      # Rust and Caddy: ci/linux.Dockerfile.
      - run: ci/in-docker.sh ci/verify.sh
