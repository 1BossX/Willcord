name: P1 foundations
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: verify (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runs-on: '["macos-15"]'
          - name: linux
            runs-on: '["ubuntu-24.04"]'
    runs-on: ${{ fromJSON(matrix.runs-on) }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      # Set Node after adding Homebrew so the preinstalled Homebrew Node does
      # not shadow the requested toolchain in subsequent pnpm steps.
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt
      - run: pnpm protocol:generate
      - run: git diff --exit-code -- packages/protocol/src/generated.ts worker/src/generated.rs
      - run: cargo fmt --manifest-path worker/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path worker/Cargo.toml
      - run: cargo test --locked --manifest-path worker/Cargo.toml --features fault-injection
      - run: cargo build --locked --manifest-path worker/Cargo.toml
      # The P3-C fault tests use this binary; building it here keeps the
      # cold compile from competing with the timed end-to-end tests.
      - run: cargo build --locked --manifest-path worker/Cargo.toml --features fault-injection --target-dir worker/target/fault
      - run: bash -n deploy/install.sh
      - run: python3 deploy/test-install.py
      - run: python3 deploy/test-main-node.py
      - run: python3 deploy/test-worker-join.py
      - run: python3 deploy/test-trust-ca.py
      - run: bash deploy/caddy-validate.sh
      - run: python3 deploy/test-caddy-edge.py
      - run: python3 deploy/test-diagnosis-fixtures.py
      - run: python3 deploy/test-o2-kr3-acceptance.py
      - run: bash deploy/test-release-publish.sh
      - run: bash deploy/test-release-version.sh
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      # The main node as deployed: a release directory outside the checkout,
      # started the way the systemd unit starts it.
      - run: deploy/build-main.sh "$RUNNER_TEMP/willcord-main-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --skip-build
      - run: deploy/smoke-main.sh "$RUNNER_TEMP/willcord-main-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - run: cargo build --locked --release --manifest-path worker/Cargo.toml
      - run: git diff --check
      - run: bash deploy/check-naming.sh
