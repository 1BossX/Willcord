name: P1 foundations
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: verify (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest
            runs-on: '"ubuntu-latest"'
          - name: macos-latest
            runs-on: '"macos-latest"'
          - name: self-hosted
            runs-on: '["self-hosted", "macOS"]'
    runs-on: ${{ fromJSON(matrix.runs-on) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm protocol:generate
      - run: git diff --exit-code -- packages/protocol/src/generated.ts worker/src/generated.rs
      - run: cargo fmt --manifest-path worker/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path worker/Cargo.toml
      - run: cargo test --locked --manifest-path worker/Cargo.toml --features fault-injection
      - run: cargo build --locked --manifest-path worker/Cargo.toml
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: git diff --check
