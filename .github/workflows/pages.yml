name: Publish Willcord site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  # The public installer is taken from the latest formal Release, so publishing
  # a Release (not a change on main) is what updates it.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    # The Free organization can publish Pages after the repository is public.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check static entry and assets
        run: |
          test -f site/index.html
          test -f site/style.css
          test -f site/assets/logo.svg
          test -f site/assets/favicon.svg
      # Serve the installer attached to the latest formal Release, never the
      # copy on main: it must match the images and binaries it downloads.
      # gh skips drafts and pre-releases when no tag is given.
      - name: Include the latest Release's installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/installer"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'install.sh' --pattern 'install.sh.sha256' --dir "$dir"
          (cd "$dir" && shasum -a 256 -c install.sh.sha256)
          bash -n "$dir/install.sh"
          cp "$dir/install.sh" site/install.sh
          echo "Installer from $(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
