name: Release
# A v* tag builds native binaries on each platform's runner (no cross-compiling)
# and attaches them to a draft GitHub Release, published by hand after review.
# The Linux files are built in the Ubuntu 24.04 CI image, the main host's
# distribution, so the main node's native modules match its glibc.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build-macos:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - run: corepack enable
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - run: ci/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release/*
          if-no-files-found: error
  build-linux:
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - run: ci/in-docker.sh ci/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/*
          if-no-files-found: error
  publish:
    needs: [build-macos, build-linux]
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh >/dev/null || { echo "gh CLI is required on this runner" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "Worker Plane $GITHUB_REF_NAME" --notes "Install and upgrade: docs/operations.md. Verify each file against its .sha256."
