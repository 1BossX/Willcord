name: Release
# A v* tag builds native binaries on each platform's runner (no cross-compiling)
# and attaches them to a draft GitHub Release, published by hand after review.
# Linux workers link against glibc 2.17 through cargo-zigbuild, so one binary
# runs on CentOS 7 / Debian 10 / Ubuntu 20.04 and newer, not only on the
# runner's own glibc; a check runs it on old distributions before packaging.
on:
  push:
    tags: ['v*']
  # Build and check only; the draft release is created from tags alone.
  pull_request:
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.sha) }}
  # Built into the binary as `willcord main init`'s default image version; a
  # non-release build has none and must be given --image-version.
  WILLCORD_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            arch: arm64
            runs-on: '["macos-15"]'
          - name: macos-x86_64
            arch: x86_64
            runs-on: '["macos-15-intel"]'
          - name: linux-x86_64
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            runs-on: '["ubuntu-24.04"]'
          - name: linux-arm64
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            runs-on: '["ubuntu-24.04-arm"]'
    runs-on: ${{ fromJSON(matrix.runs-on) }}
    steps:
      - run: test "$(uname -m)" = "${{ matrix.arch }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - run: corepack enable
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - run: cargo test --locked --manifest-path worker/Cargo.toml
      - run: python3 deploy/test-install.py
      - run: bash deploy/test-release-version.sh
      - name: Build worker
        if: runner.os == 'macOS'
        run: |
          cargo build --locked --release --manifest-path worker/Cargo.toml
          echo "WORKER_BIN=worker/target/release/willcord" >> "$GITHUB_ENV"
      # cargo-zigbuild 0.23.4 or newer drops the aarch64 linker flag
      # --fix-cortex-a53-843419 that zig rejects. zig's linker notes that it
      # ignores rustc's -O1; rustc reports that as linker_messages, which the
      # deny-warnings setup would turn into a failure.
      - name: Build worker (glibc 2.17)
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: -D warnings -A linker_messages
        run: |
          python3 -m pip install --user --break-system-packages ziglang==0.14.1 cargo-zigbuild==0.23.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          rustup target add ${{ matrix.target }}
          cargo zigbuild --locked --release --manifest-path worker/Cargo.toml --target ${{ matrix.target }}.2.17
          echo "WORKER_BIN=worker/target/${{ matrix.target }}/release/willcord" >> "$GITHUB_ENV"
      - run: '"$WORKER_BIN" worker status --json'
        env:
          WILLCORD_HOME: ${{ runner.temp }}/worker-smoke
      - name: Check the worker runs on old glibc
        if: runner.os == 'Linux'
        run: |
          need=$(objdump -T "$WORKER_BIN" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest glibc symbol version: $need"
          # An upper bound: x86_64 may top out below 2.17.
          [ "$(printf '%s\n' "$need" GLIBC_2.17 | sort -V | tail -1)" = GLIBC_2.17 ] \
            || { echo "expected at most GLIBC_2.17" >&2; exit 1; }
          for image in centos:7 debian:11 ubuntu:22.04 rockylinux:9; do
            docker run --rm -v "$PWD/$WORKER_BIN:/w:ro" -e WILLCORD_HOME=/tmp/wp "$image" /w worker status --json > /dev/null
            echo "$image: ok"
          done
      - name: Package worker
        run: |
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m)
          name="willcord-${VERSION}-${os}-${arch}"
          mkdir -p release
          bash -n deploy/install.sh
          cp deploy/install.sh deploy/docker/compose.yaml release/
          cp "$WORKER_BIN" "release/$name"
      # The main node runs on Linux; its native modules are built for this
      # runner's architecture and Node 24.
      - name: Package main node
        if: runner.os == 'Linux'
        run: |
          arch=$(uname -m)
          dir="$RUNNER_TEMP/willcord-main-${VERSION}"
          rm -rf "$dir"
          deploy/build-main.sh "$dir"
          deploy/smoke-main.sh "$dir"
          tar -C "$RUNNER_TEMP" -czf "release/willcord-main-${VERSION}-linux-${arch}-node24.tar.gz" "willcord-main-${VERSION}"
      - name: Checksums
        working-directory: release
        run: for f in *; do shasum -a 256 "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/release-publish.sh
