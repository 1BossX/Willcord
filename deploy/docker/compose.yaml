# Main node with Docker Compose (docs/docker.md). Required in the environment
# or an .env file beside this one:
#   WILLCORD_VERSION  image tag, e.g. 0.2.0
#   WILLCORD_SITE     host:port browsers and workers use, e.g. plane.internal:8443
#   WILLCORD_PORT     the port in WILLCORD_SITE, published on the host
#   WILLCORD_BIND_IP  host IP to publish WILLCORD_PORT on (not 0.0.0.0 unless you mean it;
#                     Docker bypasses host firewalls such as ufw)
#   WILLCORD_LOCAL_PORT  optional; host port (loopback only) for http://localhost, default 8480
# main.env holds PUBLIC_BASE_URL (https://$WILLCORD_SITE), the model key
# and, on first start only, INITIAL_ADMIN_PASSWORD.
name: willcord
services:
  main:
    image: ${WILLCORD_REGISTRY:-ghcr.io/bossoptional}/willcord-main:${WILLCORD_VERSION:?set WILLCORD_VERSION}
    env_file: ${WILLCORD_ENV_FILE:-main.env}
    volumes:
      - main-data:/var/lib/willcord
    # SIGTERM stops the node and releases main.lock; give it the unit's 30 s.
    stop_grace_period: 30s
    # After a crash main.lock stays behind and a restart is refused on
    # purpose; an operator checks and removes it (docs/docker.md).
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [internal]
  caddy:
    image: ${WILLCORD_REGISTRY:-ghcr.io/bossoptional}/willcord-caddy:${WILLCORD_VERSION:?set WILLCORD_VERSION}
    environment:
      WILLCORD_SITE: ${WILLCORD_SITE:?set WILLCORD_SITE}
      WILLCORD_LOCAL_PORT: ${WILLCORD_LOCAL_PORT:-8480}
    ports:
      - "${WILLCORD_BIND_IP:?set WILLCORD_BIND_IP}:${WILLCORD_PORT}:${WILLCORD_PORT}"
      # Plain HTTP for this machine only: http://localhost:${WILLCORD_LOCAL_PORT:-8480}
      - "127.0.0.1:${WILLCORD_LOCAL_PORT:-8480}:8480"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [main]
    restart: unless-stopped
    networks: [internal]
volumes:
  main-data:
  caddy-data:
  caddy-config:
networks:
  internal:
