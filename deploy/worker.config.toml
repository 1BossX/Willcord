# Production worker configuration: /etc/willcord/worker.toml (Linux) or
# /usr/local/etc/willcord/worker.toml (macOS). Owned by the worker user, 0600.
worker_id = "worker-a"
# Ledger, output logs and the data directory lock; keep it on persistent disk.
data_dir = "/var/lib/willcord-worker"
url = "wss://plane.internal:8443/ws/worker"
# The token file is reread on every reconnect, so rotation needs no restart.
token_file = "/etc/willcord/token"
# PATH for commands; add /opt/homebrew/bin on Apple Silicon Macs.
# command_path = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"
# Optional limits (defaults shown).
# kill_grace_secs = 10
# max_tool_timeout_secs = 1800
# log_disk_budget_bytes = 2147483648
# min_free_bytes = 1073741824
# result_retention_secs = 604800

[[workspaces]]
workspace_id = "project"
config_version = 1
path = "/srv/project"
repo_id = "github.com/1BossX/Willcord"
is_default = true
