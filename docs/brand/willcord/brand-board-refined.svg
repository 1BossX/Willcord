<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-label="Willcord refined identity board" style="color:#202532"><title>Willcord refined identity board</title><rect width="1200" height="1180" fill="#f4f3ef"/><rect width="1200" height="370" fill="#151822"/><text x="48" y="42" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#b6bac9" font-weight="400">WILLCORD / IDENTITY REFINEMENT / 02</text><g transform="translate(48 88) scale(1.65)" style="color:#f7f6fb"><g style="color:#a797ff"><path d="M9 15 L20 48 L32 27 L44 48 L55 15" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="27" r="4.5" fill="currentColor"/></g><g transform="translate(80 12)"><g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path transform="translate(0 0)" d="M2 16 L10 38 L18 20 L26 38 L34 16"/><path transform="translate(42 0)" d="M5 16 V38"/><circle cx="47" cy="6" r="2.5" fill="currentColor" stroke="none"/><path transform="translate(60 0)" d="M5 4 V38"/><path transform="translate(78 0)" d="M5 4 V38"/><path transform="translate(96 0)" d="M23 18 C9 9 2 18 2 27 C2 37 12 43 23 36"/><path transform="translate(130 0)" d="M26 27 C26 12 2 12 2 27 C2 42 26 42 26 27"/><path transform="translate(166 0)" d="M3 38 V16 M3 24 C8 16 14 14 20 17"/><path transform="translate(196 0)" d="M26 4 V38 M26 27 C26 12 2 12 2 27 C2 42 26 42 26 27"/></g></g></g><text x="48" y="265" font-family="Arial, PingFang SC, sans-serif" font-size="34" fill="#f7f6fb" font-weight="600">大脑留在中心，机器只管执行。</text><text x="48" y="314" font-family="Arial, PingFang SC, sans-serif" font-size="21" fill="#b6bac9" font-weight="400">面向内网与生产环境的 AI 运维控制面</text><text x="48" y="424" font-family="Arial, PingFang SC, sans-serif" font-size="24" fill="#202532" font-weight="600">01 / 图形与字标</text><text x="48" y="461" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#626877" font-weight="400">收紧 W 的宽度与线条；中心节点融入连接。字标改为独立几何路径，减少字体依赖。</text><rect x="48" y="487" width="528" height="160" rx="14" fill="white"/><g transform="translate(75 519) scale(1.5)" style="color:#7660e8"><path d="M9 15 L20 48 L32 27 L44 48 L55 15" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="27" r="4.5" fill="currentColor"/></g><g transform="translate(195 540)" style="color:#202532"><g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path transform="translate(0 0)" d="M2 16 L10 38 L18 20 L26 38 L34 16"/><path transform="translate(42 0)" d="M5 16 V38"/><circle cx="47" cy="6" r="2.5" fill="currentColor" stroke="none"/><path transform="translate(60 0)" d="M5 4 V38"/><path transform="translate(78 0)" d="M5 4 V38"/><path transform="translate(96 0)" d="M23 18 C9 9 2 18 2 27 C2 37 12 43 23 36"/><path transform="translate(130 0)" d="M26 27 C26 12 2 12 2 27 C2 42 26 42 26 27"/><path transform="translate(166 0)" d="M3 38 V16 M3 24 C8 16 14 14 20 17"/><path transform="translate(196 0)" d="M26 4 V38 M26 27 C26 12 2 12 2 27 C2 42 26 42 26 27"/></g></g><rect x="600" y="487" width="552" height="160" rx="14" fill="#151822"/><g transform="translate(628 519) scale(1.5)" style="color:#ffffff"><path d="M9 15 L20 48 L32 27 L44 48 L55 15" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="27" r="4.5" fill="currentColor"/></g><g transform="translate(748 540)" style="color:#ffffff"><g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path transform="translate(0 0)" d="M2 16 L10 38 L18 20 L26 38 L34 16"/><path transform="translate(42 0)" d="M5 16 V38"/><circle cx="47" cy="6" r="2.5" fill="currentColor" stroke="none"/><path transform="translate(60 0)" d="M5 4 V38"/><path transform="translate(78 0)" d="M5 4 V38"/><path transform="translate(96 0)" d="M23 18 C9 9 2 18 2 27 C2 37 12 43 23 36"/><path transform="translate(130 0)" d="M26 27 C26 12 2 12 2 27 C2 42 26 42 26 27"/><path transform="translate(166 0)" d="M3 38 V16 M3 24 C8 16 14 14 20 17"/><path transform="translate(196 0)" d="M26 4 V38 M26 27 C26 12 2 12 2 27 C2 42 26 42 26 27"/></g></g><text x="48" y="700" font-family="Arial, PingFang SC, sans-serif" font-size="24" fill="#202532" font-weight="600">02 / 小尺寸专用</text><text x="48" y="734" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#626877" font-weight="400">16–24px 简化中心节点；32px 起使用主图形。小尺寸优先看清 W。</text><rect x="48" y="760" width="160" height="135" rx="12" fill="white"/><g transform="translate(76 783) scale(1.0)" style="color:#202532"><path d="M2 4 L5 12 L8 7 L11 12 L14 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="74" y="868" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#626877" font-weight="400">16px / micro</text><rect x="232" y="760" width="160" height="135" rx="12" fill="white"/><g transform="translate(260 783) scale(1.25)" style="color:#202532"><path d="M2 4 L5 12 L8 7 L11 12 L14 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="258" y="868" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#626877" font-weight="400">20px / micro</text><rect x="416" y="760" width="160" height="135" rx="12" fill="white"/><g transform="translate(444 783) scale(1.5)" style="color:#202532"><path d="M2 4 L5 12 L8 7 L11 12 L14 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="442" y="868" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#626877" font-weight="400">24px / micro</text><rect x="600" y="760" width="160" height="135" rx="12" fill="white"/><g transform="translate(628 783) scale(0.5)" style="color:#202532"><path d="M9 15 L20 48 L32 27 L44 48 L55 15" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="27" r="4.5" fill="currentColor"/></g><text x="626" y="868" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#626877" font-weight="400">32px / standard</text><rect x="784" y="760" width="160" height="135" rx="12" fill="white"/><g transform="translate(812 783) scale(0.75)" style="color:#202532"><path d="M9 15 L20 48 L32 27 L44 48 L55 15" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="27" r="4.5" fill="currentColor"/></g><text x="810" y="868" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#626877" font-weight="400">48px / standard</text><rect x="968" y="760" width="160" height="135" rx="12" fill="white"/><g transform="translate(996 783) scale(1.0)" style="color:#202532"><path d="M9 15 L20 48 L32 27 L44 48 L55 15" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="27" r="4.5" fill="currentColor"/></g><text x="994" y="868" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#626877" font-weight="400">64px / standard</text><text x="48" y="951" font-family="Arial, PingFang SC, sans-serif" font-size="24" fill="#202532" font-weight="600">03 / 色彩与留白</text><rect x="48" y="980" width="252" height="54" rx="8" fill="#7660e8"/><text x="48" y="1060" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#626877" font-weight="400">PRIMARY  #7660e8</text><rect x="324" y="980" width="252" height="54" rx="8" fill="#151822"/><text x="324" y="1060" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#626877" font-weight="400">BACKGROUND  #151822</text><rect x="600" y="980" width="252" height="54" rx="8" fill="#a797ff"/><text x="600" y="1060" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#626877" font-weight="400">ON DARK  #a797ff</text><rect x="876" y="980" width="252" height="54" rx="8" fill="#202532"/><text x="876" y="1060" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#626877" font-weight="400">INK  #202532</text><text x="48" y="1110" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#202532" font-weight="400">最小留白：图形边界外 8/64 高度。禁止拉伸、描边叠加、旋转及渐变。</text><text x="48" y="1150" font-family="Arial, PingFang SC, sans-serif" font-size="13" fill="#626877" font-weight="400">候选品牌 · 视觉细化稿 · 目标用户与商标近似验证尚未完成</text></svg>