<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-label="Willcord tech study" style="color:#7660e8"><title>Willcord tech study</title><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs><rect width="1200" height="1080" fill="#f4f3ef"/><rect width="1200" height="450" fill="#111621"/><rect width="1200" height="450" fill="url(#grid)"/><text x="48" y="42" font-family="Arial, PingFang SC, sans-serif" font-size="12" font-weight="400" fill="#9da9bd">WILLCORD / TECH EXPLORATION / 03</text><path d="M48 75 H144 M48 75 V94 M1152 75 H1056 M1152 75 V94" fill="none" stroke="#47cbb5" stroke-width="2"/><g transform="translate(48 102) scale(1.75)" style="color:#a797ff"><path d="M9 15 L20 48 L32 27 L44 48 L55 15" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="square" stroke-linejoin="bevel"/><path d="M32 21 L38 27 L32 33 L26 27 Z" fill="currentColor"/></g><g transform="translate(185 126) scale(1.8)" style="color:#f7f6fb"><g transform="translate(4 2)"><g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path transform="translate(0 0)" d="M2 16 L10 38 L18 20 L26 38 L34 16"/><path transform="translate(42 0)" d="M5 16 V38"/><circle cx="47" cy="6" r="2.5" fill="currentColor" stroke="none"/><path transform="translate(60 0)" d="M5 4 V38"/><path transform="translate(78 0)" d="M5 4 V38"/><path transform="translate(96 0)" d="M23 18 C9 9 2 18 2 27 C2 37 12 43 23 36"/><path transform="translate(130 0)" d="M26 27 C26 12 2 12 2 27 C2 42 26 42 26 27"/><path transform="translate(166 0)" d="M3 38 V16 M3 24 C8 16 14 14 20 17"/><path transform="translate(196 0)" d="M26 4 V38 M26 27 C26 12 2 12 2 27 C2 42 26 42 26 27"/></g></g></g><text x="48" y="293" font-family="Arial, PingFang SC, sans-serif" font-size="34" font-weight="600" fill="#f7f6fb">大脑留在中心，机器只管执行。</text><text x="48" y="337" font-family="Arial, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#a9b5c8">面向内网与生产环境的 AI 运维控制面</text><rect x="48" y="379" width="6" height="6" fill="#47cbb5"/><text x="67" y="389" font-family="Arial, PingFang SC, sans-serif" font-size="17" font-weight="400" fill="#a797ff">断线先对账，未知不重跑。</text><g fill="none" stroke="#47cbb5" stroke-opacity=".45" stroke-width="2"><path d="M984 180 H1090 V260 H1140 M984 180 V115 H1140 M984 180 V340 H1090"/></g><rect x="980" y="176" width="8" height="8" fill="#47cbb5"/><rect x="1136" y="256" width="8" height="8" fill="#47cbb5"/><rect x="1136" y="111" width="8" height="8" fill="#47cbb5"/><rect x="1086" y="336" width="8" height="8" fill="#47cbb5"/><g transform="translate(901 142) scale(1.4375)" style="color:#a797ff"><path d="M9 15 L20 48 L32 27 L44 48 L55 15" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="square" stroke-linejoin="bevel"/><path d="M32 21 L38 27 L32 33 L26 27 Z" fill="currentColor"/></g><text x="869" y="411" font-family="Arial, PingFang SC, sans-serif" font-size="12" font-weight="400" fill="#9da9bd">CORE → EXECUTION</text><text x="48" y="505" font-family="Arial, PingFang SC, sans-serif" font-size="27" font-weight="600" fill="#202532">熟悉的轮廓，更利落的连接</text><text x="48" y="542" font-family="Arial, PingFang SC, sans-serif" font-size="17" font-weight="400" fill="#626877">主图形改用平切端点、斜角转折和菱形核心；网格与青色连接仅用于品牌背景。</text><rect x="48" y="575" width="540" height="232" rx="12" fill="white"/><text x="72" y="613" font-family="Arial, PingFang SC, sans-serif" font-size="16" font-weight="600" fill="#202532">02 / ROUND · 原版</text><g transform="translate(72 645) scale(1.625)" style="color:#7660e8"><path d="M9 15 L20 48 L32 27 L44 48 L55 15" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="27" r="4.5" fill="currentColor"/></g><g transform="translate(221 660) scale(0.25)" style="color:#202532"><path d="M9 15 L20 48 L32 27 L4