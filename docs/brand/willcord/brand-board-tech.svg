te(881 660) scale(0.5)" style="color:#202532"><path d="M9 15 L20 48 L32 27 L44 48 L55 15" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="square" stroke-linejoin="bevel"/><path d="M32 21 L38 27 L32 33 L26 27 Z" fill="currentColor"/></g><text x="881" y="770" font-family="Arial, PingFang SC, sans-serif" font-size="12" font-weight="400" fill="#626877">32px</text><g transform="translate(977 660) scale(1.0)" style="color:#202532"><path d="M9 15 L20 48 L32 27 L44 48 L55 15" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="square" stroke-linejoin="bevel"/><path d="M32 21 L38 27 L32 33 L26 27 Z" fill="currentColor"/></g><text x="977" y="770" font-family="Arial, PingFang SC, sans-serif" font-size="12" font-weight="400" fill="#626877">64px</text><text x="48" y="868" font-family="Arial, PingFang SC, sans-serif" font-size="24" font-weight="600" fill="#202532">应用原则</text><text x="48" y="907" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="400" fill="#626877">Logo 保持单色，不添加发光、渐变或电路纹理。</text><text x="48" y="941" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="400" fill="#626877">青色 #47cbb5 只做辅助线与节点；不承担正文或运行状态语义。</text><text x="48" y="975" font-family="Arial, PingFang SC, sans-serif" font-size="18" font-weight="400" fill="#626877">16–24px 继续使用简化 W；科技版主图形建议用于 32px 及以上。</text><text x="48" y="1035" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="400" fill="#626877">视觉探索稿 · 原版资产保留 · 尚未替换产品界面</text></svg>