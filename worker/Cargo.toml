[package]
name = "willcord"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
[features]
# Test-only crash points for the P3 fault program. Never enable in releases.
fault-injection = []
[dependencies]
tokio = { version = "=1.48.0", features = ["full"] }
tokio-tungstenite = { version = "=0.28.0", features = ["rustls-tls-native-roots"] }
futures-util = "=0.3.31"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
serde_jcs = "=0.1.0"
sha2 = "=0.10.9"
base64 = "=0.22.1"
libc = "=0.2.190"
fs2 = "=0.4.3"
uuid = { version = "=1.18.1", features = ["v4"] }
toml = "=0.9.8"
jsonschema = { version = "=0.33.0", default-features = false }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }

ring = "=0.17.14"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots", "json"] }

# Release binaries are built natively on each platform's runner and published as-is.
[profile.release]
lto = true
codegen-units = 1
strip = true
